<!--
  Wazuh - Windows 11 AGENT configuration   [SANITIZED COPY]
  Install location on the host: C:\Program Files (x86)\ossec-agent\ossec.conf
  Capabilities: SCA, FIM, Malware Detection (feeds the manager's VirusTotal lookups),
                Threat Hunting (Windows Event Channels + Sysmon).

  >>> Replace <MANAGER_IP> with the IP of your Ubuntu Wazuh manager before use. <<<
-->
<ossec_config>
  <!-- ===================== Manager connection ===================== -->
  <client>
    <server>
      <address><MANAGER_IP></address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>windows, windows11</config-profile>
    <crypto_method>aes</crypto_method>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>5000</queue_size>
    <events_per_second>500</events_per_second>
  </client_buffer>

  <!-- ============ Security Configuration Assessment (SCA) ========= -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

  <!-- =============== Rootcheck (policy / malware) ================= -->
  <rootcheck>
    <disabled>no</disabled>
    <windows_apps>./shared/win_applications_rcl.txt</windows_apps>
    <windows_malware>./shared/win_malware_rcl.txt</windows_malware>
  </rootcheck>

  <!-- ===================== System inventory ====================== -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
    <hotfixes>yes</hotfixes>
  </wodle>

  <!-- ================ File Integrity Monitoring =================== -->
  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>
    <alert_new_files>yes</alert_new_files>
    <auto_ignore>no</auto_ignore>
    <!-- Real-time monitoring. New/changed files here are hashed and sent to the
         manager, which runs the VirusTotal lookup (malware detection). -->
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\Users\*\Downloads</directories>
    <directories realtime="yes" check_all="yes" report_changes="yes">C:\Users\*\Desktop</directories>
    <!-- Critical system areas (periodic integrity check) -->
    <directories check_all="yes">C:\Windows\System32\drivers\etc</directories>
    <directories check_all="yes" recursion_level="1">C:\Windows\System32\wbem</directories>
    <directories check_all="yes" recursion_level="1">C:\Program Files</directories>
    <directories check_all="yes" recursion_level="1">C:\Program Files (x86)</directories>
    <!-- Registry autoruns / persistence (common malware footholds) -->
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\Run</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows\CurrentVersion\RunOnce</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\System\CurrentControlSet\Services</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Windows NT\CurrentVersion\Winlogon</windows_registry>
    <windows_registry arch="both">HKEY_LOCAL_MACHINE\Software\Microsoft\Active Setup\Installed Components</windows_registry>
    <!-- Noise reduction -->
    <ignore>C:\Windows\System32\LogFiles</ignore>
    <ignore type="sregex">.log$|.tmp$|.etl$</ignore>
    <registry_ignore>HKEY_LOCAL_MACHINE\Security\Policy\Secrets</registry_ignore>
    <skip_nfs>yes</skip_nfs>
    <process_priority>10</process_priority>
    <max_eps>50</max_eps>
    <synchronization>
      <enabled>yes</enabled>
      <interval>5m</interval>
      <max_eps>10</max_eps>
    </synchronization>
  </syscheck>

  <!-- ========== THREAT HUNTING: Windows Event Channels =========== -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>Event/System[EventID != 5145 and EventID != 5156 and EventID != 5447 and
      EventID != 4656 and EventID != 4658 and EventID != 4663 and EventID != 4660 and
      EventID != 4670 and EventID != 4690 and EventID != 4703 and EventID != 4907]</query>
  </localfile>
  <localfile>
    <location>System</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Application</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- Sysmon: install Sysmon first. Until then the channel is simply empty. -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>
  <!-- Active response log -->
  <localfile>
    <log_format>syslog</log_format>
    <location>active-response\active-responses.log</location>
  </localfile>

  <labels>
    <label key="host.role">windows11-endpoint</label>
  </labels>
</ossec_config>
